# ==============================================================================
# SafeHer Nexus Backend - Production Spring Profile ('prod')
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SafeHerHikariProdPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # NEVER set to 'create' or 'create-drop' in production.
      # 'validate' guarantees existing schemas and data remain untouched.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  # When deployed behind a reverse proxy (e.g., Nginx, Caddy, AWS ALB),
  # respect X-Forwarded-* headers for HTTPS detection and client IP extraction:
  forward-headers-strategy: framework
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:safehernexus}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    # Strictly define your production domains (e.g., https://safehernexus.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://safehernexus.com}

logging:
  level:
    root: WARN
    com.safehernexus.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
