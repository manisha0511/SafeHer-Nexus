# ==============================================================================
# SafeHer Nexus Production Nginx Configuration
# High-Security Reverse Proxy with TLS 1.3, HSTS, and Rate Limiting
# Place in /etc/nginx/conf.d/safeher-nexus.conf or /etc/nginx/sites-available/
# ==============================================================================

# 1. Rate Limiting Zones (DDoS and Abuse Prevention)
limit_req_zone $binary_remote_addr zone=safeher_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=safeher_auth_limit:10m rate=5r/s;

# 2. HTTP Port 80 - Mandatory 301 Permanent Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.safehernexus.com safehernexus.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Port 443 - SSL/TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.safehernexus.com;

    # SSL Certificates (Managed by Certbot / Let's Encrypt or custom CA)
    ssl_certificate /etc/letsencrypt/live/api.safehernexus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.safehernexus.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.safehernexus.com/chain.pem;

    # Modern TLS Protocols and Cipher Suites (PFS / Forward Secrecy)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HTTP Strict Transport Security (HSTS) - 1 year with subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Client Request Limits
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Authentication Endpoints Rate Limit
    location /api/auth/ {
        limit_req zone=safeher_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # General API Routes
    location / {
        limit_req zone=safeher_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Disable proxy buffering for streaming / Live responses if needed
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
