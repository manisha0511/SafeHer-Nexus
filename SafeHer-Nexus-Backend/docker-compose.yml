services:
  safeher-mysql:
    image: mysql:8.0
    container_name: safeher-nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ChangeMeRoot2026!}
      MYSQL_DATABASE: ${DB_NAME:-safeher_nexus_db}
      MYSQL_USER: ${DB_USERNAME:-safeher_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMeUser2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema-mysql-reference.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ChangeMeRoot2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeher-network

  safeher-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeher-nexus-backend
    restart: unless-stopped
    depends_on:
      safeher-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://safeher-mysql:3306/${DB_NAME:-safeher_nexus_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-safeher_user}
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMeUser2026!}
      DB_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_strong_random_256_bit_secret_key_for_local_dev_only}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://safehernexus.com}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE_NUMBER: ${TWILIO_FROM_PHONE_NUMBER:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - safeher-network

volumes:
  mysql_data:

networks:
  safeher-network:
    driver: bridge
